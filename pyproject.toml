[project]
name = "notes-rag"
version = "0.1.0"
description = "RAG for Markdown notes"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "cron-converter>=1.3.1",
  "fastapi>=0.136.1",
  "gitpython>=3.1.46",
  "llama-index-core>=0.14.20",
  "llama-index-embeddings-huggingface>=0.7.0",
  "llama-index-readers-file>=0.6.0",
  "llama-index-vector-stores-chroma>=0.5.5",
  "pydantic>=2.12.5",
  "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_rag"]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pyright>=1.1.408",
  "ruff>=0.15.10",
]

[project.scripts]
notes-rag = "notes_rag.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false
