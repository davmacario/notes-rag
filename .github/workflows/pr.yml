name: PR pipeline

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run Python unit tests
        run: uv run pytest

      - name: Verify image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  release-preview:
    name: Preview next release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prepare local release preview
        run: |
          git fetch --force --tags "https://github.com/${GITHUB_REPOSITORY}.git"
          git clone --bare . "$RUNNER_TEMP/release-preview.git"
          node -e 'const fs = require("fs"); const c = JSON.parse(fs.readFileSync(".releaserc.json")); c.plugins = c.plugins.filter(p => (Array.isArray(p) ? p[0] : p) !== "@semantic-release/github"); fs.writeFileSync(".releaserc.json", JSON.stringify(c));'

      # --no-ci is required: semantic-release otherwise bails out early on
      # pull_request events, before it ever analyses the commits.
      # --branches overrides the `main`-only config so the PR branch is allowed.
      - name: semantic-release --dry-run
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -o pipefail
          unset GITHUB_ACTIONS
          npm run release:dry -- --branches "$HEAD_REF" --repository-url "file://$RUNNER_TEMP/release-preview.git" 2>&1 \
            | tee /tmp/semantic-release.log

          version="$(grep -oP 'The next release version is \K[0-9][^\s]*' /tmp/semantic-release.log | tail -n 1 || true)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Report next version
        if: always()
        run: |
          {
            echo "## Release preview"
            echo
            if [ -f .release-version ]; then
              echo "Merging this PR will publish **v$(cat .release-version)**."
            else
              echo "No release will be created"
            fi
            echo
            echo "<details><summary>semantic-release dry-run log</summary>"
            echo
            echo '```'
            cat /tmp/semantic-release.log 2>/dev/null || echo '(no log captured)'
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
